name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator
        run: |
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o winlator.zip
          unzip -q winlator.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # 1. Find the EXACT directory where gradlew is hiding
          GRADLE_DIR=$(find . -name gradlew -exec dirname {} \;)
          echo "Robot is moving to: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          # 2. Give permissions and start
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
