name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Clone Official Winlator
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 https://github.com/brunodev85/winlator.git winlator_engine

      - name: Inject Your Custom Files
        run: |
          # This moves your modified files into the official source code
          find . -name "MemoryManagerService.java" -exec cp {} winlator_engine/app/src/main/java/com/winlator/core/ \; 2>/dev/null || true
          # Add any other specific file moves here if you know their paths

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd winlator_engine
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: winlator_engine/app/build/outputs/apk/release/*.apk
