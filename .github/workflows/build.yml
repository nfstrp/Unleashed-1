name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator Source (No Budget Limit)
        run: |
          # Download the source code as a ZIP to bypass LFS/Budget errors
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o winlator.zip
          unzip winlator.zip
          mv winlator-main winlator_engine

      - name: Inject Your Custom Files
        run: |
          # Find your edited file and force it into the official source code
          # If you have multiple files, this finds them all by name
          find . -maxdepth 1 -name "*.java" -exec cp {} winlator_engine/app/src/main/java/com/winlator/core/ \; 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd winlator_engine
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: winlator_engine/app/build/outputs/apk/release/*.apk
