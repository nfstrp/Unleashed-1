name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Force Download Winlator
        run: |
          # Use curl to get the zip and unzip it into the current folder
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o winlator.zip
          unzip -q winlator.zip
          # Move everything from the unzipped folder to the main area
          cp -rf winlator-main/* .
          cp -rf winlator-main/.* . || true

      - name: Inject Your Custom Files
        run: |
          # Move your edited files into the source code
          # This replaces the default files with your modded ones
          cp -f MemoryManagerService.java app/src/main/java/com/winlator/core/ || true
          cp -f thermal_patch.java app/src/main/java/com/winlator/core/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # The "find" command ensures we find gradlew even if it's buried
          GRADLE_PATH=$(find . -name gradlew)
          chmod +x $GRADLE_PATH
          $GRADLE_PATH assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
