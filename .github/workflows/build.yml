name: Build Winlator APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: repo-files
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Download Winlator source
      run: |
        wget https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -O winlator.zip
        unzip winlator.zip
    
    - name: Flatten directory structure (including hidden files)
      run: |
        # First, let's see what's actually in winlator-main
        echo "=== Contents of winlator-main directory ==="
        ls -la winlator-main/
        
        echo ""
        echo "=== Checking for gradlew specifically ==="
        find winlator-main -name "gradlew" -o -name "gradlew.bat"
        
        # Move all contents from winlator-main to workspace root
        # Using find/exec to ensure we get everything
        find winlator-main -mindepth 1 -maxdepth 1 -exec mv {} ./ \;
        
        # Remove the now-empty directory
        rmdir winlator-main
        
        # Verify the structure
        echo "Root directory contents:"
        ls -la
        
        echo "Checking for Gradle settings file:"
        if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
          echo "✓ Gradle settings file found"
          ls -l settings.gradle* 2>/dev/null || true
        else
          echo "⚠ No settings.gradle or settings.gradle.kts found"
          echo "This may be a single-module project"
        fi
        
        echo "Checking for build.gradle in app directory:"
        if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
          echo "✓ app/build.gradle found"
        else
          echo "✗ app/build.gradle NOT found"
          exit 1
        fi
        
        echo "Checking for gradlew:"
        if [ -f "gradlew" ]; then
          echo "✓ gradlew found"
        else
          echo "✗ gradlew NOT found"
          exit 1
        fi
    
    - name: Inject custom files
      run: |
        # Create target directory if it doesn't exist
        mkdir -p app/src/main/java/com/winlator/core/
        
        # Copy the custom files from your repo
        cp repo-files/MemoryManagerService.java app/src/main/java/com/winlator/core/
        cp repo-files/thermal_patch.java app/src/main/java/com/winlator/core/
        
        # Verify files were copied
        echo "Verifying injected files:"
        ls -l app/src/main/java/com/winlator/core/ | grep -E "(MemoryManagerService|thermal_patch)"
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: winlator-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
    
    - name: Display build summary
      if: success()
      run: |
        echo "✓ Build completed successfully!"
        echo "APK files generated:"
        ls -lh app/build/outputs/apk/release/*.apk
