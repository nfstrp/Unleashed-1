name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4
        with:
          path: my-repo # Puts your Java files in a separate folder

      - name: Clone Winlator Source
        run: |
          # Clone only the latest commit to save space and time
          git clone --depth 1 https://github.com/brunodev85/winlator.git winlator-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject and Build
        run: |
          cd winlator-src
          
          # 1. Inject mods from your repo folder
          CORE_DIR="app/src/main/java/com/winlator/core"
          echo "Injecting into $CORE_DIR"
          cp -f ../my-repo/MemoryManagerService.java "$CORE_DIR/" || echo "Mod 1 skipped"
          cp -f ../my-repo/thermal_patch.java "$CORE_DIR/" || echo "Mod 2 skipped"
          
          # 2. Build using the included gradlew (Git clone always includes this)
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: winlator-src/app/build/outputs/apk/release/*.apk
