name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator Source
        run: |
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -q main.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Project and Build
        run: |
          # 1. Hunt for the folder that actually contains 'settings.gradle'
          REAL_ROOT=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
          echo "Target project found at: $REAL_ROOT"
          cd "$REAL_ROOT"

          # 2. Inject your modded files
          # We search for the 'core' folder inside our current target
          CORE_DIR=$(find . -type d -name "core" | grep "com/winlator" | head -n 1)
          if [ -n "$CORE_DIR" ]; then
            echo "Injecting into $CORE_DIR"
            cp -f $GITHUB_WORKSPACE/MemoryManagerService.java "$CORE_DIR/" || true
            cp -f $GITHUB_WORKSPACE/thermal_patch.java "$CORE_DIR/" || true
          fi

          # 3. Use the Gradle Tool that came with the project (Wrapper)
          # This is much safer than the Global Gradle
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
