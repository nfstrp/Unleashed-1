name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download and Diagnose
        run: |
          # 1. Download
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -q main.zip
          
          # 2. SHOW ME EVERYTHING (This helps us debug)
          echo "--- FOLDER STRUCTURE START ---"
          find . -maxdepth 3 -not -path '*/.*'
          echo "--- FOLDER STRUCTURE END ---"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Final Boss Build Attempt
        run: |
          # Find the folder containing 'settings.gradle'
          CONF_FILE=$(find . -name "settings.gradle" | head -n 1)
          
          if [ -z "$CONF_FILE" ]; then
            echo "CRITICAL ERROR: settings.gradle not found anywhere!"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$CONF_FILE")
          echo "Moving to: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # Inject Mods
          CORE_DIR=$(find . -type d -name "core" | grep "com/winlator" | head -n 1)
          if [ -n "$CORE_DIR" ]; then
            cp -f $GITHUB_WORKSPACE/MemoryManagerService.java "$CORE_DIR/" || true
            cp -f $GITHUB_WORKSPACE/thermal_patch.java "$CORE_DIR/" || true
          fi

          # Build
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
