name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download and Flatten Source
        run: |
          # 1. Download
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -q main.zip
          
          # 2. Force move everything from the subfolder to the ROOT
          # This puts settings.gradle exactly where the robot is looking
          cp -rf winlator-main/* .
          cp -rf winlator-main/.* . || true
          rm -rf winlator-main main.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject and Build
        run: |
          # 1. Inject mods (Path is now simple because we flattened the folders)
          CORE_DIR="app/src/main/java/com/winlator/core"
          echo "Injecting into $CORE_DIR"
          cp -f MemoryManagerService.java "$CORE_DIR/" || echo "Mod 1 skipped"
          cp -f thermal_patch.java "$CORE_DIR/" || echo "Mod 2 skipped"
          
          # 2. Build using the local gradlew (it MUST be here now)
          # If it's still missing, we fallback to global
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: app/build/outputs/apk/release/*.apk
