name: Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Winlator Source
        run: |
          # 1. Download and extract
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o source.zip
          unzip -q source.zip
          
          # 2. Force move everything (including hidden files) to the root
          # This makes settings.gradle visible to the build tool
          cp -rf winlator-main/. .
          
          # 3. Inject your custom files
          mkdir -p app/src/main/java/com/winlator/core
          cp -f MemoryManagerService.java app/src/main/java/com/winlator/core/
          cp -f thermal_patch.java app/src/main/java/com/winlator/core/

      - name: Build APK
        run: |
          # Use the local wrapper which is now definitely in the root
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Modded
          path: app/build/outputs/apk/release/*.apk
