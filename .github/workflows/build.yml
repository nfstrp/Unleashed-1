name: Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Project
        run: |
          # 1. Download and unzip
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o source.zip
          unzip -q source.zip
          
          # 2. CLEAR THE ROOT and move winlator files there
          # This ensures settings.gradle is exactly where Gradle looks
          cp -rf winlator-main/* .
          
          # 3. Inject your custom files into the now-flat structure
          CORE_PATH="app/src/main/java/com/winlator/core"
          cp -f MemoryManagerService.java "$CORE_PATH/"
          cp -f thermal_patch.java "$CORE_PATH/"

      - name: Build APK
        run: |
          # Use the wrapper that comes with Winlator
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Modded
          path: app/build/outputs/apk/release/*.apk
