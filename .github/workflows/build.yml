name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator Source
        run: |
          # Download and force extract into the CURRENT directory
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -o main.zip
          # Move everything out of the subfolder into the root
          mv winlator-main/* . || true
          mv winlator-main/.* . || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject and Build
        run: |
          # 1. Inject your files into the core folder
          # We search for the core folder everywhere
          CORE_DIR=$(find . -type d -name "core" | grep "com/winlator" | head -n 1)
          if [ -n "$CORE_DIR" ]; then
            cp -f MemoryManagerService.java "$CORE_DIR/" || true
            cp -f thermal_patch.java "$CORE_DIR/" || true
            echo "Injected mods into $CORE_DIR"
          fi

          # 2. Find the REAL gradlew (the keys to the house)
          REAL_GRADLEW=$(find . -name gradlew | head -n 1)
          if [ -z "$REAL_GRADLEW" ]; then
            echo "STILL NO GRADLEW! Using global gradle..."
            gradle assembleRelease --no-daemon
          else
            echo "Found gradlew at $REAL_GRADLEW. Running build..."
            chmod +x "$REAL_GRADLEW"
            "$REAL_GRADLEW" assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
