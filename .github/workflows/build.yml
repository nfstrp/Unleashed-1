name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download and Merge Winlator
        run: |
          wget https://github.com/brunodev85/winlator/archive/refs/heads/main.zip
          unzip -q main.zip
          # The dot after 'winlator-main/.' is the secret trick to move hidden files
          cp -rf winlator-main/. .
          rm -rf winlator-main main.zip

      - name: Inject Custom Java Files
        run: |
          # Finding the exact folder to place your modded files
          CORE_DIR=$(find app/src/main/java -name "core" -type d | head -n 1)
          cp -f MemoryManagerService.java "$CORE_DIR/" || true
          cp -f thermal_patch.java "$CORE_DIR/" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # Checking if the file exists before running
          ls -la gradlew
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: app/build/outputs/apk/release/*.apk
