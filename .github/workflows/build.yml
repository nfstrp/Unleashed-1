name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator Source
        run: |
          wget https://github.com/brunodev85/winlator/archive/refs/heads/main.zip
          unzip -q main.zip
          # Move everything from the unzipped folder to here
          cp -rf winlator-main/* .
          rm -rf winlator-main main.zip

      - name: Inject Custom Java Files
        run: |
          # This takes your modified files and forces them into the correct folder
          # We use 'find' to make sure we hit the right destination
          DEST=$(find app/src/main/java -name "core" -type d)
          cp -f MemoryManagerService.java $DEST/ || true
          cp -f thermal_patch.java $DEST/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: app/build/outputs/apk/release/*.apk
