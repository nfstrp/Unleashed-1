name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download and Prepare Winlator
        run: |
          # 1. Download the source zip
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o source.zip
          unzip -q source.zip
          
          # 2. Rename the folder to something simple
          mv winlator-main winlator-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject and Build
        run: |
          # 1. Inject mods (using full paths to be safe)
          CORE_DIR="winlator-src/app/src/main/java/com/winlator/core"
          echo "Injecting into $CORE_DIR"
          cp -f MemoryManagerService.java "$CORE_DIR/" || echo "Mod 1 skipped"
          cp -f thermal_patch.java "$CORE_DIR/" || echo "Mod 2 skipped"
          
          # 2. Build using the system Gradle
          # We tell it exactly where the project is
          cd winlator-src
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: winlator-src/app/build/outputs/apk/release/*.apk
