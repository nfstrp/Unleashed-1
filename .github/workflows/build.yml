name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator Source
        run: |
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -q main.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Project and Build
        run: |
          # 1. Find the folder containing ANY settings.gradle file
          # We use a wildcard * to catch .gradle or .gradle.kts
          CONF_FILE=$(find . -name "settings.gradle*" | head -n 1)
          REAL_ROOT=$(dirname "$CONF_FILE")
          
          echo "Target project found at: $REAL_ROOT"
          cd "$REAL_ROOT"

          # 2. Inject your modded files
          # We use the full path from your previous log to be safe
          CORE_DIR=$(find . -type d -name "core" | grep "com/winlator" | head -n 1)
          if [ -n "$CORE_DIR" ]; then
            echo "Injecting into $CORE_DIR"
            cp -f $GITHUB_WORKSPACE/MemoryManagerService.java "$CORE_DIR/" || true
            cp -f $GITHUB_WORKSPACE/thermal_patch.java "$CORE_DIR/" || true
          fi

          # 3. Build using Global Gradle
          # We'll use the system gradle to avoid the 'gradlew missing' error entirely
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
