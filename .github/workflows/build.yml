name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator
        run: |
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o winlator.zip
          unzip winlator.zip
          # We just want to find the folder name for the next step
          ls -d */ | grep winlator

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # We find the folder and GO INSIDE it to build
          cd winlator-main
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: winlator-main/app/build/outputs/apk/release/*.apk
