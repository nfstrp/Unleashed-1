name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Source
        run: |
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -q main.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Build inside winlator-main
        run: |
          # 1. Enter the specific folder we know exists
          cd winlator-main
          
          # 2. Inject your modded files from the folder above (..)
          echo "Injecting mods..."
          cp -f ../MemoryManagerService.java app/src/main/java/com/winlator/core/ || echo "File 1 skipped"
          cp -f ../thermal_patch.java app/src/main/java/com/winlator/core/ || echo "File 2 skipped"

          # 3. Start the build
          # We use the global gradle because the project's 'gradlew' is often missing in zips
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
