name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download and Force Merge
        run: |
          # 1. Download the zip
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o source.zip
          unzip -q source.zip
          
          # 2. Find the folder (whatever it's named) and move everything out
          # This works even if the folder is named 'winlator-main' or something else
          FOLDER=$(find . -maxdepth 1 -type d -name "*winlator*" | head -n 1)
          cp -rn $FOLDER/. .
          
          # 3. Verify the file is here now
          if [ -f "gradlew" ]; then echo "FOUND GRADLEW"; else echo "STILL MISSING"; fi

      - name: Inject Custom Java Files
        run: |
          # Force copy your modded files into the core directory
          # We use a broad search to ensure it finds the right 'core' folder
          CORE_DIR=$(find . -type d -name "core" | grep "com/winlator" | head -n 1)
          cp -f MemoryManagerService.java "$CORE_DIR/" || true
          cp -f thermal_patch.java "$CORE_DIR/" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: app/build/outputs/apk/release/*.apk
