name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Source
        run: |
          wget https://github.com/brunodev85/winlator/archive/refs/heads/main.zip
          unzip -q main.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Parent and Build
        run: |
          # 1. We look for 'settings.gradle' which is ONLY in the root folder
          PROJECT_ROOT=$(find . -name settings.gradle -type f | head -n 1 | xargs dirname)
          echo "Moving to CORRECT root: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # 2. Now that we are in the root, we can find the core folder correctly
          # The path is definitely 'app/src/main/java/...' relative to here
          CORE_DIR=$(find app/src/main/java -name "core" -type d | head -n 1)
          
          echo "Injecting mods into: $CORE_DIR"
          # Copy files from the GitHub Workspace (where your repo files are)
          cp -f $GITHUB_WORKSPACE/MemoryManagerService.java "$CORE_DIR/" || echo "No MemoryManager found"
          cp -f $GITHUB_WORKSPACE/thermal_patch.java "$CORE_DIR/" || echo "No ThermalPatch found"

          # 3. Build using Global Gradle
          # We use the global tool because it's more reliable than the wrapper here
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
