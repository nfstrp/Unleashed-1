name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Source
        run: |
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -q main.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: The Final Stand
        run: |
          # 1. FIND the project root (where settings.gradle is)
          # We search deep to find the real heart of the project
          CONF_FILE=$(find . -name "settings.gradle*" | head -n 1)
          REAL_ROOT=$(dirname "$CONF_FILE")
          echo "REAL_ROOT is: $REAL_ROOT"
          
          # 2. FIND the core folder for injection
          CORE_DIR=$(find . -type d -name "core" | grep "com/winlator" | head -n 1)
          echo "CORE_DIR is: $CORE_DIR"
          
          # 3. Inject mods using absolute paths so we don't get lost
          cp -f "$GITHUB_WORKSPACE/MemoryManagerService.java" "$CORE_DIR/" || echo "Mod 1 failed"
          cp -f "$GITHUB_WORKSPACE/thermal_patch.java" "$CORE_DIR/" || echo "Mod 2 failed"
          
          # 4. Jump into the root and build
          cd "$REAL_ROOT"
          
          # Check for gradlew first, fallback to global gradle
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
