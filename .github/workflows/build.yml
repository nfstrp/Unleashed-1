name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download and Force Extract
        run: |
          # 1. Download source
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o source.zip
          unzip -q source.zip
          
          # 2. Delete the conflicting folder in the root to make room
          rm -rf .github
          
          # 3. Move everything including hidden files (dotglob)
          shopt -s dotglob
          cp -rf winlator-main/* .
          rm -rf winlator-main source.zip
          
          # 4. Verify the map exists
          ls -F | grep "settings.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject and Build
        run: |
          # 1. Inject mods
          CORE_DIR="app/src/main/java/com/winlator/core"
          mkdir -p "$CORE_DIR"
          cp -f MemoryManagerService.java "$CORE_DIR/" || echo "Mod 1 skipped"
          cp -f thermal_patch.java "$CORE_DIR/" || echo "Mod 2 skipped"
          
          # 2. Run Gradle with the direct project directory pointer
          gradle assembleRelease --project-dir . --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: app/build/outputs/apk/release/*.apk
