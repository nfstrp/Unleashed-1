name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download and Force Extract
        run: |
          # 1. Download
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o source.zip
          
          # 2. Extract specifically into the current folder
          unzip -q source.zip
          
          # 3. Use 'dot-globbing' to move everything including hidden files
          shopt -s dotglob
          mv winlator-main/* .
          rm -rf winlator-main source.zip
          
          # 4. Debug: Check if settings file exists
          ls -F

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject and Build
        run: |
          # 1. Inject mods
          CORE_DIR="app/src/main/java/com/winlator/core"
          cp -f MemoryManagerService.java "$CORE_DIR/" || echo "Mod 1 skipped"
          cp -f thermal_patch.java "$CORE_DIR/" || echo "Mod 2 skipped"
          
          # 2. Force Gradle to find the settings file by naming the project root
          # We use '--project-dir .' to tell it "Build exactly what is here"
          gradle assembleRelease --project-dir . --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: app/build/outputs/apk/release/*.apk
