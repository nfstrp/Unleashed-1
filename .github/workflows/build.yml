name: Android Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Download Winlator Source
        run: |
          curl -L https://github.com/brunodev85/winlator/archive/refs/heads/main.zip -o main.zip
          unzip -q main.zip
          # We now know the folder is named winlator-main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # 1. Walk into the folder where the 'Map' (settings.gradle) is
          cd winlator-main
          
          # 2. Inject your modded files from the folder above (..)
          # We know the path now thanks to your last log!
          cp -f ../MemoryManagerService.java app/src/main/java/com/winlator/core/ || true
          cp -f ../thermal_patch.java app/src/main/java/com/winlator/core/ || true
          
          # 3. Use the Wrapper if it exists, otherwise use Global Gradle
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Custom-APK
          path: "**/build/outputs/apk/release/*.apk"
